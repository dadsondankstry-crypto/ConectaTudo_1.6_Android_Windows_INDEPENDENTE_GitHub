name: Compilar Android APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
jobs:
  apk:
    name: ConectaTudo Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar plataforma e ferramentas Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Gerar APK de depuracao
        run: gradle -p android --no-daemon --stacktrace :app:assembleDebug
      - name: Publicar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ConectaTudo-Android-1.6-INDEPENDENTE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
