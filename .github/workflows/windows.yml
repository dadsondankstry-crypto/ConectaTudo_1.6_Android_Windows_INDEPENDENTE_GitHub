name: Compilar Windows EXE
on:
  push:
    branches: ['**']
  workflow_dispatch:
jobs:
  windows:
    name: ConectaTudo Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r windows/requirements.txt
      - name: Verificar arquivos Python
        run: python -m compileall -q windows
      - name: Testar API de transferencias e permissao remota
        run: python -m unittest discover -s tests -v
      - name: Criar programa EXE portatil
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ConectaTudo-Windows-1.6 --paths windows --add-data 'windows/painel.html;.' --add-data 'windows/tablet.html;.' windows/app.py
      - name: Preparar Inno Setup para instalador
        shell: pwsh
        run: choco install innosetup --yes --no-progress
        continue-on-error: true
      - name: Gerar instalador Setup EXE (opcional)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (Test-Path $iscc) { & $iscc 'windows\ConectaTudo.iss' }
          else { Write-Host 'Inno Setup indisponivel: EXE portatil continua disponivel.' }
        continue-on-error: true
      - name: Publicar instalador Windows
        uses: actions/upload-artifact@v4
        with:
          name: ConectaTudo-Windows-1.6-INSTALADOR
          path: dist/ConectaTudo-Setup-1.6.exe
          if-no-files-found: warn
      - name: Publicar EXE
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ConectaTudo-Windows-1.6-EXE
          path: dist/ConectaTudo-Windows-1.6.exe
          if-no-files-found: error
