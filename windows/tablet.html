<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ConectaTudo 1.6 • Modo tablet</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e19;color:#eff6ff;font:16px system-ui,Arial,sans-serif}header{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 15px;background:#17263d}b{color:#8ac0ff}button{background:#2f76cf;color:white;padding:10px 13px;border:0;border-radius:9px;font:inherit}button:focus-visible{outline:3px solid #fff}#state{flex:1;font-size:14px;color:#d5e4fd}#frame{width:100%;height:calc(100dvh - 72px);object-fit:contain;background:#000;display:block}small{color:#acc0df}#hint{margin:0;padding:8px 12px;background:#122035}body.full header,body.full #hint{display:none}body.full #frame{height:100dvh}
</style></head><body><header><b>📺 ConectaTudo 1.6 · Espelhamento</b><span id="state">Verificando...</span><button id="reload">Reconectar</button><button id="full">⛶ Tela cheia</button></header><p id="hint"><small>Mostra a tela atual do Legion Go; NÃO estende a área de trabalho. O Windows precisa autorizar o compartilhamento. Use rede privada e não compartilhe o PIN.</small></p><img id="frame" alt="Tela atual do Legion Go"/><script>
'use strict';let pin=new URL(location.href).searchParams.get('pin')||'';const state=document.getElementById('state'),img=document.getElementById('frame');let timer;
async function go(){clearTimeout(timer);if(!/^\d{6}$/.test(pin)){state.textContent='PIN inválido ou ausente; abra pelo ConectaTudo com IP e PIN.';return;}try{let r=await fetch('/api/info?pin='+encodeURIComponent(pin),{cache:'no-store'});if(!r.ok)throw new Error(r.status===403?'PIN recusado':'Falha HTTP '+r.status);let data=await r.json();if(!data.screen){img.removeAttribute('src');state.textContent='Compartilhamento desligado no Legion Go';timer=setTimeout(go,2500);return;}state.textContent='🟢 Espelhando '+(data.name||'Legion Go');img.src='/api/screen.mjpeg?pin='+encodeURIComponent(pin)+'&t='+Date.now();}catch(e){state.textContent='Sem conexão: '+e.message;timer=setTimeout(go,2500);}}
img.addEventListener('error',()=>{state.textContent='Transmissão interrompida; reconectando...';timer=setTimeout(go,1700)});document.getElementById('reload').onclick=go;document.getElementById('full').onclick=()=>{document.body.classList.toggle('full');img.requestFullscreen?.().catch(()=>{});};go();
</script></body></html>
